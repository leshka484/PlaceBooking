services:
  web:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - .:/app
    env_file:
      - .env
    command: >
      sh -c "alembic upgrade head && uvicorn app.app:app --host 0.0.0.0 --port 8000 --reload"
  
  database:
    image: postgres:16
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "$POSTGRES_USER", "-d", "$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 5
  
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
  
  celery_worker:
    build: .
    command: celery -A app.core.celery_app worker --loglevel=INFO
    depends_on:
      - rabbitmq

  celery_beat:
    build: .
    command: celery -A app.core.celery_app beat --loglevel=INFO
    depends_on:
      - rabbitmq

volumes:
  postgres_data: